name: React Frontend CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x' # Or 20.x, whichever you use locally

    - name: Install Dependencies
      run: npm install

    - name: Build React App
      # This creates your 'dist' or 'build' folder
      run: npm run build
      
    - name: Success Message
      run: echo "🚀 React app built successfully without errors!"

    # ==========================================
    # 🛑 DEPLOYMENT (CD) STEP GOES HERE! 🛑
    # ==========================================
